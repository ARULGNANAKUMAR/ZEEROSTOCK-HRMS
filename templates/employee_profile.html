<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Profile - ZEEROSTOCK HRMS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">
  {% include "_employee_sidebar.html" with context %}
  <div class="content">
    <h1>My Profile</h1>
    <p class="page-subtitle">View your details and update basic information</p>

    <div id="page-alert" class="alert alert-error hidden"></div>
    <div id="page-success" class="alert alert-success hidden"></div>

    <div class="card">
      <h2>Profile Details</h2>
      <form id="profile-form">
        <div class="form-row">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="p-name" disabled>
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="text" id="p-email" disabled>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Department</label>
            <input type="text" id="p-department" disabled>
          </div>
          <div class="form-group">
            <label>Designation</label>
            <input type="text" id="p-designation" disabled>
          </div>
        </div>
        <div class="form-group">
          <label for="p-phone">Phone (editable)</label>
          <input type="text" id="p-phone">
        </div>
        <button type="submit" class="btn">Save Changes</button>
      </form>
    </div>

    <div class="card">
      <h2>Change Password</h2>
      <div id="pw-alert" class="alert alert-error hidden"></div>
      <div id="pw-success" class="alert alert-success hidden"></div>
      <form id="password-form">
        <div class="form-group">
          <label for="current-password">Current Password</label>
          <input type="password" id="current-password" required>
        </div>
        <div class="form-group">
          <label for="new-password">New Password</label>
          <input type="password" id="new-password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-secondary">Change Password</button>
      </form>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/employee-profile.js') }}"></script>
</body>
</html>
