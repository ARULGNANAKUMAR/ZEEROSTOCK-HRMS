<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Dashboard - ZEEROSTOCK HRMS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">
  {% include "_employee_sidebar.html" with context %}
  <div class="content">
    <h1>My Dashboard</h1>
    <p class="page-subtitle">Your personal snapshot for today</p>

    <div id="page-alert" class="alert alert-error hidden"></div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="label">Today's Attendance</div>
        <div class="value" id="stat-today-status">--</div>
      </div>
      <div class="stat-card">
        <div class="label">Leave Requests Approved</div>
        <div class="value" id="stat-approved">--</div>
      </div>
      <div class="stat-card">
        <div class="label">Leave Requests Pending</div>
        <div class="value" id="stat-pending">--</div>
      </div>
    </div>

    <div class="card">
      <h2>Personal Information</h2>
      <div id="profile-info">Loading...</div>
    </div>

    <div class="card">
      <h2>Recent Notifications</h2>
      <ul id="notifications-list" style="padding-left: 18px; margin: 0;">
        <li class="empty-state" style="list-style:none;">Loading...</li>
      </ul>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/employee-dashboard.js') }}"></script>
</body>
</html>
