<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Employee Management - ZEEROSTOCK HRMS</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="app-shell">
  {% include "_hr_sidebar.html" with context %}
  <div class="content">
    <div class="flex-between">
      <div>
        <h1>Employee Management</h1>
        <p class="page-subtitle">Add, edit, and search employee records</p>
      </div>
      <button class="btn" onclick="openAddModal()">+ Add Employee</button>
    </div>

    <div id="page-alert" class="alert alert-error hidden"></div>

    <div class="card">
      <div class="filters-bar">
        <div class="form-group">
          <label for="search-input">Search</label>
          <input type="text" id="search-input" placeholder="Name, email, department, designation...">
        </div>
        <button class="btn btn-secondary btn-sm" onclick="loadEmployees()">Search</button>
      </div>

      <table>
        <thead>
          <tr>
            <th>Name</th><th>Email</th><th>Phone</th><th>Department</th>
            <th>Designation</th><th>Date of Joining</th><th></th>
          </tr>
        </thead>
        <tbody id="employees-body">
          <tr><td colspan="7" class="empty-state">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add / Edit modal -->
<div class="modal-overlay hidden" id="employee-modal">
  <div class="modal-box">
    <h2 id="modal-title">Add Employee</h2>
    <div id="modal-alert" class="alert alert-error hidden"></div>
    <form id="employee-form">
      <input type="hidden" id="emp-id">
      <div class="form-group">
        <label for="emp-name">Name *</label>
        <input type="text" id="emp-name" required>
      </div>
      <div class="form-group">
        <label for="emp-email">Email *</label>
        <input type="email" id="emp-email" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="emp-phone">Phone</label>
          <input type="text" id="emp-phone">
        </div>
        <div class="form-group">
          <label for="emp-doj">Date of Joining *</label>
          <input type="date" id="emp-doj" required>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="emp-department">Department</label>
          <input type="text" id="emp-department">
        </div>
        <div class="form-group">
          <label for="emp-designation">Designation</label>
          <input type="text" id="emp-designation">
        </div>
      </div>
      <div class="form-group" id="password-group">
        <label for="emp-password">Temporary Login Password</label>
        <input type="text" id="emp-password" placeholder="Default: Welcome@123">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn" id="save-btn">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/hr-employees.js') }}"></script>
</body>
</html>
