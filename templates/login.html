<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ZEEROSTOCK HRMS - Login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <h1>ZEEROSTOCK HRMS</h1>
      <p class="subtitle">Sign in to your account</p>

      <div class="hint-box">
        <strong>Default HR login</strong><br>
        Email: hr@zeerostock.com<br>
        Password: HrAdmin@123<br>
        (Employee accounts are created by HR from Employee Management.)
      </div>

      <div id="login-alert" class="alert alert-error hidden"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-block" id="login-btn">Log In</button>
      </form>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
